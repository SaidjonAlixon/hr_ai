          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internship"

  /internships/{id}:
    get:
      operationId: getInternship
      tags: [internships]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Stajirovka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internship"
    patch:
      operationId: updateInternship
      tags: [internships]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternshipUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internship"

  # --- EMPLOYEES (Faol xodimlar) ---
  /employees:
    get:
      operationId: getEmployees
      tags: [employees]
      parameters:
        - { name: departmentId, in: query, schema: { type: number } }
        - { name: mentorId, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Xodimlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Xodim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  # --- VAZIFALAR (Tasks board) ---
  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: assigneeKind, in: query, schema: { type: string, enum: [user, employee] } }
        - { name: assigneeId, in: query, schema: { type: number } }
        - { name: board, in: query, schema: { type: string, enum: [active, all] } }
      responses:
        "200":
          description: Vazifalar ro'yxati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vazifa"
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VazifaInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vazifa"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Vazifa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vazifa"
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VazifaUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vazifa"
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi

  # --- NOTIFICATIONS ---
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Bildirishnomalar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: O'qildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: Barchasi o'qildi

  # --- DASHBOARD ---
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Umumiy statistika
      responses:
        "200":
          description: Statistika
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/pipeline-overview:
    get:
      operationId: getPipelineOverview
