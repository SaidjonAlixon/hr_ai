                  $ref: "#/components/schemas/RecruiterTask"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # --- AUTH ---
    LoginInput:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # --- USER ---
    User:
      type: object
      required: [id, fullName, role, status, createdAt]
      properties:
        id: { type: number }
        fullName: { type: string }
        role:
          type: string
          enum: [admin, recruiter, hr, hr_direktor, hr_kadr_rahbar, hr_auditor, hr_menejer, trainer, mentor, director, department_head, mudir, koordinator, texnik, ombor, farmasevt]
        departmentId: { type: ["integer", "null"] }
        departmentName: { type: ["string", "null"] }
        login: { type: string }
        phone: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, inactive]
        createdAt: { type: string }

    UserInput:
      type: object
      required: [fullName, role]
      properties:
        fullName: { type: string }
        role: { type: string }
        departmentId: { type: ["integer", "null"] }
        login: { type: string }
        password: { type: string }
        phone: { type: ["string", "null"] }
        status: { type: string }

    CreateUserResult:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            temporaryPassword: { type: string }

    UserUpdate:
      type: object
      properties:
        fullName: { type: string }
        role: { type: string }
        departmentId: { type: ["integer", "null"] }
        phone: { type: ["string", "null"] }
        status: { type: string }

    # --- DEPARTMENT ---
    Department:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        headId: { type: ["integer", "null"] }
        headName: { type: ["string", "null"] }
        createdAt: { type: string }

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        headId: { type: ["integer", "null"] }

    DepartmentUpdate:
      type: object
      properties:
        name: { type: string }
        headId: { type: ["integer", "null"] }

    # --- REQUEST ---
    Request:
      type: object
      required: [id, departmentId, position, count, status, priority, createdAt]
      properties:
        id: { type: number }
        departmentId: { type: number }
        departmentName: { type: ["string", "null"] }
        position: { type: string }
        count: { type: number }
        description: { type: ["string", "null"] }
        requirements: { type: ["string", "null"] }
        salaryRange: { type: ["string", "null"] }
        deadline: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        priority:
          type: string
          enum: [urgent, normal]
        status:
          type: string
          enum: [submitted, reviewing, accepted, announced, closed]
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        assignedAt: { type: ["string", "null"] }
        createdById: { type: ["integer", "null"] }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string }
        vacancyId: { type: ["integer", "null"] }
        vacancyCreatedAt: { type: ["string", "null"] }
        vacancyAssignedAt: { type: ["string", "null"] }
        vacancyAcceptedAt: { type: ["string", "null"] }
        vacancyPublishedAt: { type: ["string", "null"] }

    RequestInput:
      type: object
      required: [departmentId, position, count, priority, city, district]
      properties:
        departmentId: { type: number }
        position: { type: string }
        count: { type: number }
        description: { type: string }
        requirements: { type: string }
        salaryRange: { type: string }
        deadline: { type: string }
        reason: { type: string }
        city: { type: string }
        district: { type: string }
        priority: { type: string }

    RequestUpdate:
      type: object
      properties:
        position: { type: string }
        count: { type: number }
        description: { type: string }
        requirements: { type: string }
        salaryRange: { type: string }
        deadline: { type: string }
        reason: { type: string }
        priority: { type: string }
        status: { type: string }

    AssignInput:
      type: object
      required: [userId]
      properties:
        userId: { type: number }

    ApproveRequestInput:
      type: object
      required: [recruiterId]
      properties:
        recruiterId: { type: number }
        deadline: { type: string }

    ApproveRequestVacancy:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id: { type: number }
        title: { type: string }
        status: { type: string }
        recruiterId: { type: ["integer", "null"] }
        createdAt: { type: string }
        deadline: { type: ["string", "null"] }

    ApproveRequestResult:
      type: object
      required: [request, vacancy]
      properties:
        request:
          $ref: "#/components/schemas/Request"
        vacancy:
          $ref: "#/components/schemas/ApproveRequestVacancy"

    # --- VACANCY ---
    Vacancy:
      type: object
      required: [id, requestId, title, status, createdAt]
      properties:
        id: { type: number }
        requestId: { type: number }
        title: { type: string }
        description: { type: ["string", "null"] }
        salaryRange: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        schedule: { type: ["string", "null"] }
        benefits: { type: ["string", "null"] }
        channels:
          type: array
          items:
            $ref: "#/components/schemas/VacancyChannel"
        status:
          type: string
          enum: [draft, published, closed]
        recruiterId: { type: ["integer", "null"] }
        recruiterName: { type: ["string", "null"] }
        deadline: { type: ["string", "null"] }
        requestPosition: { type: ["string", "null"] }
        departmentName: { type: ["string", "null"] }
        requestCount: { type: ["number", "null"] }
        requestRequirements: { type: ["string", "null"] }
        requestDescription: { type: ["string", "null"] }
        requestPriority: { type: ["string", "null"] }
        assignedAt: { type: ["string", "null"] }
        acceptedAt: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        candidatesCount: { type: number }

    VacancyChannel:
      type: object
      required: [channelId, channelName, channelIcon]
      properties:
        channelId: { type: number }
        channelName: { type: string }
        channelIcon: { type: string }
        publishedAt: { type: ["string", "null"] }
        views: { type: number }
        applications: { type: number }

    VacancyInput:
      type: object
      required: [requestId, title, recruiterId, deadline]
      properties:
        requestId: { type: number }
        title: { type: string }
        description: { type: string }
        salaryRange: { type: string }
        location: { type: string }
        schedule: { type: string }
        benefits: { type: string }
        recruiterId: { type: number }
        deadline: { type: string }

    VacancyUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        salaryRange: { type: string }
        location: { type: string }
        schedule: { type: string }
        benefits: { type: string }
        status: { type: string }
        recruiterId: { type: number }
        deadline: { type: string }

    PublishVacancyInput:
      type: object
      required: [channelIds]
      properties:
        channelIds:
          type: array
          items:
            type: number

    # --- CANDIDATE ---
    Candidate:
      type: object
      required: [id, fullName, phone, vacancyId, stage, createdAt]
      properties:
        id: { type: number }
        fullName: { type: string }
        birthDate: { type: ["string", "null"] }
        phone: { type: string }
        address: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        education: { type: ["string", "null"] }
        experience: { type: ["string", "null"] }
        expectedSalary: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        vacancyId: { type: number }
        vacancyTitle: { type: ["string", "null"] }
        recruiterId: { type: ["integer", "null"] }
        recruiterName: { type: ["string", "null"] }
        stage:
          type: string
          enum: [phone_interview, online_interview, preboarding, offline_interview, final_decision, offer, documents, internship, hired]
        status:
          type: string
          enum: [active, rejected, hired]
        createdAt: { type: string }

    CandidateInput:
      type: object
      required: [fullName, phone, vacancyId]
      properties:
        fullName: { type: string }
        birthDate: { type: string }
        phone: { type: string }
        address: { type: string }
        education: { type: string }
        experience: { type: string }
        expectedSalary: { type: string }
        notes: { type: string }
        vacancyId: { type: number }
        recruiterId: { type: number }

    CandidateUpdate:
      type: object
      properties:
        fullName: { type: string }
        birthDate: { type: string }
        phone: { type: string }
        address: { type: string }
        education: { type: string }
        experience: { type: string }
        expectedSalary: { type: string }
        notes: { type: string }
        stage: { type: string }
        status: { type: string }
        recruiterId: { type: number }

    CandidatePipeline:
      type: object
      required: [candidateId, stages]
      properties:
        candidateId: { type: number }
        candidateName: { type: string }
        currentStage: { type: string }
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"

    PipelineStage:
      type: object
      required: [key, label, status]
      properties:
        key: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        completedAt: { type: ["string", "null"] }
        details: { type: ["string", "null"] }

    # --- PHONE INTERVIEW ---
    PhoneInterview:
      type: object
      required: [id, candidateId, status, createdAt]
      properties:
        id: { type: number }
        candidateId: { type: number }
        candidateName: { type: ["string", "null"] }
        recruiterId: { type: ["integer", "null"] }
        recruiterName: { type: ["string", "null"] }
        interviewDate: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [suitable, not_suitable, pending]
        rejectReason: { type: ["string", "null"] }
        createdAt: { type: string }

    PhoneInterviewInput:
      type: object
      required: [candidateId]
      properties:
        candidateId: { type: number }
        recruiterId: { type: number }
        interviewDate: { type: string }
        notes: { type: string }
        status: { type: string }
        rejectReason: { type: string }

    PhoneInterviewUpdate:
      type: object
      properties:
        interviewDate: { type: string }
        notes: { type: string }
        status: { type: string }
        rejectReason: { type: string }

    # --- ONLINE INTERVIEW ---
    OnlineInterview:
      type: object
      required: [id, candidateId, createdAt]
      properties:
        id: { type: number }
        candidateId: { type: number }
        candidateName: { type: ["string", "null"] }
        interviewDate: { type: ["string", "null"] }
        questionsAnswers:
          type: array
          items:
            $ref: "#/components/schemas/QA"
        experienceLevel:
          type: ["string", "null"]
          enum: ["experienced", "inexperienced", null]
        score: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    QA:
      type: object
      required: [question]
      properties:
        question: { type: string }
        answer: { type: ["string", "null"] }

    OnlineInterviewInput:
      type: object
      required: [candidateId]
      properties:
        candidateId: { type: number }
        interviewDate: { type: string }
        questionsAnswers:
          type: array
          items:
            $ref: "#/components/schemas/QA"
        experienceLevel: { type: string }
        score: { type: number }
        notes: { type: string }

    OnlineInterviewUpdate:
      type: object
      properties:
        interviewDate: { type: string }
        questionsAnswers:
          type: array
          items:
            $ref: "#/components/schemas/QA"
        experienceLevel: { type: string }
        score: { type: number }
        notes: { type: string }

    # --- PREBOARDING ---
    Preboarding:
      type: object
      required: [id, candidateId, createdAt]
      properties:
        id: { type: number }
        candidateId: { type: number }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        notes: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    ChecklistItem:
      type: object
      required: [label, completed]
      properties:
        label: { type: string }
        completed: { type: boolean }

    PreboardingInput:
      type: object
      required: [candidateId]
      properties:
        candidateId: { type: number }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        notes: { type: string }

    PreboardingUpdate:
      type: object
      properties:
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        notes: { type: string }
        completedAt: { type: string }

    # --- OFFLINE INTERVIEW ---
    OfflineInterview:
      type: object
      required: [id, candidateId, scheduledDate, attendanceStatus, createdAt]
      properties:
        id: { type: number }
        candidateId: { type: number }
        candidateName: { type: ["string", "null"] }
        scheduledDate: { type: string }
        scheduledTime: { type: ["string", "null"] }
        hrId: { type: ["integer", "null"] }
        hrName: { type: ["string", "null"] }
        trainerId: { type: ["integer", "null"] }
        trainerName: { type: ["string", "null"] }
        attendanceStatus:
          type: string
          enum: [attended, absent, rescheduled, pending]
        hrScore: { type: ["integer", "null"] }
        hrNotes: { type: ["string", "null"] }
        trainerScore: { type: ["integer", "null"] }
        trainerNotes: { type: ["string", "null"] }
        result:
          type: ["string", "null"]
          enum: ["passed", "failed", null]
        resultNotes: { type: ["string", "null"] }
        createdAt: { type: string }

    OfflineInterviewInput:
      type: object
      required: [candidateId, scheduledDate]
      properties:
        candidateId: { type: number }
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        hrId: { type: number }
        trainerId: { type: number }

    OfflineInterviewUpdate:
      type: object
      properties:
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        hrId: { type: number }
        trainerId: { type: number }
        attendanceStatus: { type: string }
        hrScore: { type: number }
        hrNotes: { type: string }
        trainerScore: { type: number }
        trainerNotes: { type: string }
        result: { type: string }
        resultNotes: { type: string }

    # --- OFFER ---
    Offer:
      type: object
      required: [id, candidateId, position, salary, status, createdAt]
      properties:
        id: { type: number }
        candidateId: { type: number }
        candidateName: { type: ["string", "null"] }
        position: { type: string }
        salary: { type: string }
        workConditions: { type: ["string", "null"] }
        documentsChecklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt: { type: string }

    OfferInput:
      type: object
      required: [candidateId, position, salary]
      properties:
        candidateId: { type: number }
        position: { type: string }
        salary: { type: string }
        workConditions: { type: string }
        documentsChecklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    OfferUpdate:
      type: object
      properties:
        position: { type: string }
        salary: { type: string }
        workConditions: { type: string }
        documentsChecklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        status: { type: string }

    # --- INTERNSHIP ---
    Internship:
      type: object
      required: [id, employeeId, startDate, createdAt]
      properties:
        id: { type: number }
        employeeId: { type: number }
        employeeName: { type: ["string", "null"] }
        trainerId: { type: ["integer", "null"] }
        trainerName: { type: ["string", "null"] }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/InternshipEvaluation"
        status:
          type: string
          enum: [ongoing, completed, failed]
          default: ongoing
        createdAt: { type: string }

    InternshipEvaluation:
      type: object
      required: [period, score]
      properties:
        period: { type: string }
        score: { type: number }
        notes: { type: ["string", "null"] }
        evaluatedAt: { type: ["string", "null"] }

    InternshipInput:
