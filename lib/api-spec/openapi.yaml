openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VAKSINA HR - Kadrlarni boshqaruv dasturi
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autentifikatsiya
  - name: departments
    description: Bo'limlar
  - name: users
    description: Foydalanuvchilar
  - name: requests
    description: Zayavkalar
  - name: vacancies
    description: Vakansiyalar
  - name: candidates
    description: Nomzodlar
  - name: phone-interviews
    description: Telefon suhbatlari
  - name: online-interviews
    description: Onlayn suhbatlar
  - name: preboarding
    description: Pre-boarding
  - name: offline-interviews
    description: Offline suhbatlar
  - name: offers
    description: Job offerlar
  - name: internships
    description: Stajirovkalar
  - name: employees
    description: Faol xodimlar
  - name: notifications
    description: Bildirishnomalar
  - name: dashboard
    description: Boshqaruv paneli statistikasi
  - name: tasks
    description: Vazifalar doskasi

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- AUTH ---
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Tizimga kirish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Muvaffaqiyatli kirish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Noto'g'ri ma'lumotlar

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Joriy foydalanuvchi ma'lumotlari
      responses:
        "200":
          description: Foydalanuvchi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Tizimdan chiqish
      responses:
        "200":
          description: Chiqildi

  # --- DEPARTMENTS ---
  /departments:
    get:
      operationId: getDepartments
      tags: [departments]
      summary: Barcha bo'limlar ro'yxati
      responses:
        "200":
          description: Bo'limlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Yangi bo'lim yaratish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Bo'lim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    patch:
      operationId: updateDepartment
      tags: [departments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi

  # --- USERS ---
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Barcha foydalanuvchilar
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Foydalanuvchilar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Yaratildi (temporaryPassword — bir marta ko'rsatiladi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResult"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Foydalanuvchi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi

  # --- REQUESTS (Zayavkalar) ---
  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: Barcha zayavkalar
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: number } }
        - { name: assignedTo, in: query, schema: { type: number } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Zayavkalar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Yangi zayavka berish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Zayavka yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Zayavka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
    patch:
      operationId: updateRequest
      tags: [requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
    delete:
      operationId: deleteRequest
      tags: [requests]
      summary: Arizani o'chirish (faqat HR va Direktor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi
        "403":
          description: Ruxsat yo'q

  /requests/{id}/assign:
    post:
      operationId: assignRequest
      tags: [requests]
      summary: Zayavkani o'ziga olish
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Biriktirildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /requests/{id}/approve:
    post:
      operationId: approveRequest
      tags: [requests]
      summary: HR tasdiqlaydi, rekruter biriktiradi va faol ish o'rni yaratadi
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestInput"
      responses:
        "201":
          description: Tasdiqlandi va ish o'rni yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveRequestResult"
        "400":
          description: Noto'g'ri so'rov
        "403":
          description: Ruxsat yo'q

  # --- VACANCIES (E'lonlar) ---
  /vacancies:
    get:
      operationId: getVacancies
      tags: [vacancies]
      summary: Barcha vakansiyalar
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: requestId, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Vakansiyalar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vacancy"
    post:
      operationId: createVacancy
      tags: [vacancies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"

  /vacancies/{id}:
    get:
      operationId: getVacancy
      tags: [vacancies]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Vakansiya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
    patch:
      operationId: updateVacancy
      tags: [vacancies]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
    delete:
      operationId: deleteVacancy
      tags: [vacancies]
      summary: Ish o'rnini o'chirish (faqat HR va Direktor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi
        "403":
          description: Ruxsat yo'q

  /vacancies/{id}/publish:
    post:
      operationId: publishVacancy
      tags: [vacancies]
      summary: Vakansiyani kanallarga joylashtirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishVacancyInput"
      responses:
        "200":
          description: Joylashtirildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"

  # --- CANDIDATES (Nomzodlar) ---
  /candidates:
    get:
      operationId: getCandidates
      tags: [candidates]
      summary: Barcha nomzodlar
      parameters:
        - { name: vacancyId, in: query, schema: { type: number } }
        - { name: stage, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: recruiterId, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Nomzodlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Nomzod yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Nomzod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    patch:
      operationId: updateCandidate
      tags: [candidates]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Nomzodni o'chirish (faqat HR va Direktor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: O'chirildi
        "403":
          description: Ruxsat yo'q

  /candidates/{id}/pipeline:
    get:
      operationId: getCandidatePipeline
      tags: [candidates]
      summary: Nomzod pipeline bosqichlari to'liq ma'lumoti
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePipeline"

  # --- PHONE INTERVIEWS ---
  /phone-interviews:
    get:
      operationId: getPhoneInterviews
      tags: [phone-interviews]
      parameters:
        - { name: candidateId, in: query, schema: { type: number } }
        - { name: recruiterId, in: query, schema: { type: number } }
      responses:
        "200":
          description: Telefon suhbatlari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneInterview"
    post:
      operationId: createPhoneInterview
      tags: [phone-interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneInterviewInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneInterview"

  /phone-interviews/{id}:
    get:
      operationId: getPhoneInterview
      tags: [phone-interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Telefon suhbat
