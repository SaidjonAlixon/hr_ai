  # --- INTERNSHIPS (Stajirovka) ---
  /internships:
    get:
      operationId: getInternships
      tags: [internships]
      parameters:
        - { name: employeeId, in: query, schema: { type: number } }
        - { name: trainerId, in: query, schema: { type: number } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Stajirovkalar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Internship"
