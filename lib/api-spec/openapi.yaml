  /preboarding:
    get:
      operationId: getPreboardings
      tags: [preboarding]
      parameters:
        - { name: candidateId, in: query, schema: { type: number } }
      responses:
        "200":
          description: Pre-boardinglar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preboarding"
    post:
      operationId: createPreboarding
      tags: [preboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreboardingInput"
