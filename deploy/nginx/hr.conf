# /etc/nginx/sites-available/hr.conf
# HR_DOMAIN va APP_DIR ni o‘zingiznikiga almashtiring (setup-server.sh avtomatik qiladi).
# HTTPS bloklarini certbot (`certbot --nginx -d HR_DOMAIN`) o‘zi qo‘shadi.

upstream hr_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name HR_DOMAIN;

    root APP_DIR/artifacts/vaksina-hr/dist/public;
    index index.html;

    # Face ID rasmlari, Excel, fayl yuklash (API limiti 15 MB)
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://hr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Server-Sent Events — buferlash o‘chiq, ulanish uzoq turadi
    location /api/realtime/stream {
        proxy_pass http://hr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
