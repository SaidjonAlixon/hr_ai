  # --- ONLINE INTERVIEWS ---
  /online-interviews:
    get:
      operationId: getOnlineInterviews
      tags: [online-interviews]
      parameters:
        - { name: candidateId, in: query, schema: { type: number } }
      responses:
        "200":
          description: Onlayn suhbatlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnlineInterview"
    post:
      operationId: createOnlineInterview
      tags: [online-interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineInterviewInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineInterview"

  /online-interviews/{id}:
    get:
      operationId: getOnlineInterview
      tags: [online-interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Onlayn suhbat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineInterview"
    patch:
      operationId: updateOnlineInterview
      tags: [online-interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineInterviewUpdate"
      responses:
        "200":
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineInterview"

