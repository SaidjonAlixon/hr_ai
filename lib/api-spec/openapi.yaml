        - { name: trainerId, in: query, schema: { type: number } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Offline suhbatlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfflineInterview"
    post:
      operationId: createOfflineInterview
      tags: [offline-interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineInterviewInput"
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineInterview"

  /offline-interviews/{id}:
