                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/channel-stats:
    get:
      operationId: getChannelStats
      tags: [dashboard]
      summary: Kanallar bo'yicha samaradorlik
      responses:
        "200":
          description: Kanal statistikasi
